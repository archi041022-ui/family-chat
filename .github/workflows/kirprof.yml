name: Сборка приложения КИРПРОФ

on:
  push:
    branches: [ main ]
    paths: [ "kirprof/**", "kirprof-app/**", ".github/workflows/kirprof.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Сборка APK
        working-directory: kirprof-app
        run: |
          mkdir -p app/src/main/assets
          cp -r ../kirprof app/src/main/assets/kirprof
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Kirprof.apk

      - name: Публикация APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kirprof-${{ github.run_number }}
          name: КИРПРОФ — сборка ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Kirprof.apk
          make_latest: "false"
