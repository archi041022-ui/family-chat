name: Сборка мессенджера

on:
  push:
    branches: [ main, "check-*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Номер сборки (для проверки обновлений в приложении)
        run: |
          VER=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          echo "{\"build\": ${{ github.run_number }}, \"version\": \"$VER\"}" > web/build.json
          cat web/build.json

      - name: Сайт КИРПРОФ (открытая страница по адресу /kirprof/)
        run: cp -r kirprof web/kirprof

      - name: Библиотека Supabase
        run: |
          mkdir -p web/vendor
          curl -fsSL -o web/vendor/supabase.js https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js
          curl -fsSL -o web/vendor/qrcode.js https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js
          curl -fsSL -o web/vendor/vosk.js https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js

      - name: Модель распознавания речи (Vosk, русский, ≈45 МБ) — для расшифровки голосовых
        run: |
          curl -fsSL -o /tmp/ru.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          cd /tmp && unzip -q ru.zip && mv vosk-model-small-ru-0.22 model && tar -czf vosk-ru.tar.gz model
          mkdir -p $GITHUB_WORKSPACE/web/models && mv /tmp/vosk-ru.tar.gz $GITHUB_WORKSPACE/web/models/
          ls -la $GITHUB_WORKSPACE/web/models

      - name: Фото → текст (Tesseract, русский словарь) — движок в приложении, тяжёлые файлы на сайте
        run: |
          mkdir -p /tmp/ocrnpm && cd /tmp/ocrnpm && npm init -y > /dev/null && npm install --silent tesseract.js@5.1.1 @tesseract.js-data/rus@1.0.0
          cd $GITHUB_WORKSPACE && mkdir -p web/vendor web/models/ocr/core web/models/ocr/lang
          cp /tmp/ocrnpm/node_modules/tesseract.js/dist/tesseract.min.js web/vendor/tesseract.min.js
          cp /tmp/ocrnpm/node_modules/tesseract.js/dist/worker.min.js web/vendor/tesseract-worker.min.js
          cp /tmp/ocrnpm/node_modules/tesseract.js-core/tesseract-core*.js web/models/ocr/core/
          F=$(find /tmp/ocrnpm/node_modules/@tesseract.js-data/rus -name rus.traineddata.gz | grep best_int | head -1)
          test -n "$F" && cp "$F" web/models/ocr/lang/rus.traineddata.gz
          ls -la web/models/ocr/core web/models/ocr/lang web/vendor

      - name: Сайт (GitHub Pages)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Сборка APK
        working-directory: android
        run: |
          mkdir -p app/src/main/assets
          cp -r ../web app/src/main/assets/web
          rm -rf app/src/main/assets/web/kirprof    # сайт мастерской в приложение не входит
          rm -rf app/src/main/assets/web/models     # модель речи скачивается с сайта по запросу, в приложение не входит
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Semya.apk

      - name: Публикация APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Семья — сборка ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Semya.apk

  stt-test:
    # проверка расшифровки голосовых в настоящем браузере
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка
        run: |
          mkdir -p web/vendor web/models
          curl -fsSL -o web/vendor/vosk.js https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js
          curl -fsSL -o /tmp/ru.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          cd /tmp && unzip -q ru.zip && mv vosk-model-small-ru-0.22 model && tar -czf vosk-ru.tar.gz model
          mv /tmp/vosk-ru.tar.gz $GITHUB_WORKSPACE/web/models/
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          espeak-ng -v ru -s 140 -w /tmp/speech.wav "привет мама как дела"
          ffmpeg -loglevel error -y -i /tmp/speech.wav -ar 48000 -c:a libopus /tmp/speech.webm
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: Расшифровка тестовой фразы
        run: python test/stt_ci.py

  ocr-test:
    # проверка «Фото → текст» в настоящем браузере
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка
        run: |
          mkdir -p /tmp/ocrnpm && cd /tmp/ocrnpm && npm init -y > /dev/null && npm install --silent tesseract.js@5.1.1 @tesseract.js-data/rus@1.0.0
          cd $GITHUB_WORKSPACE && mkdir -p web/vendor web/models/ocr/core web/models/ocr/lang web/_ci
          cp /tmp/ocrnpm/node_modules/tesseract.js/dist/tesseract.min.js web/vendor/tesseract.min.js
          cp /tmp/ocrnpm/node_modules/tesseract.js/dist/worker.min.js web/vendor/tesseract-worker.min.js
          cp /tmp/ocrnpm/node_modules/tesseract.js-core/tesseract-core*.js web/models/ocr/core/
          F=$(find /tmp/ocrnpm/node_modules/@tesseract.js-data/rus -name rus.traineddata.gz | grep best_int | head -1)
          test -n "$F" && cp "$F" web/models/ocr/lang/rus.traineddata.gz
          pip install -q playwright pillow && python -m playwright install --with-deps chromium > /dev/null
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import glob
          font = ImageFont.truetype(glob.glob("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf")[0], 54)
          im = Image.new("RGB", (1600, 700), (238, 234, 224))
          d = ImageDraw.Draw(im)
          for i, line in enumerate(["Привет, мама!", "Как дела? Семья дома.", "Купить хлеб и молоко"]):
              d.text((80, 80 + i * 170), line, fill=(30, 30, 60), font=font)
          im = im.rotate(1.5, expand=False, fillcolor=(238, 234, 224))
          im.save("web/_ci/page.jpg", quality=85)
          PY
      - name: Распознавание тестовой страницы
        run: python test/ocr_ci.py
