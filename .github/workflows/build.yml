name: Сборка мессенджера

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Библиотека Supabase
        run: |
          mkdir -p web/vendor
          curl -fsSL -o web/vendor/supabase.js https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js
          curl -fsSL -o web/vendor/qrcode.js https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js

      - name: Сайт (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Сборка APK
        working-directory: android
        run: |
          mkdir -p app/src/main/assets
          cp -r ../web app/src/main/assets/web
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Semya.apk

      - name: Публикация APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Семья — сборка ${{ github.run_number }}
          files: Semya.apk
